 <title id="title">MeteorShift current compact layout, 7 October 2026</title>
 <desc id="description">A 540 by 540 stud playable square with six half-scale town landmarks, unchanged spawn pads and debris fields, an opening diameter of 166.4, floor radius55.25 and floorY minus14.755. The meteor is twice its original size and lands at its original centreY minus1.25. Elevated MiningAccess is removed; lower meteor geometry is partly buried and ground access QA remains pending.</desc>
